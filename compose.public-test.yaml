name: wepoker-public-test

services:
  postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    stop_grace_period: 30s
    volumes:
      - public-test-postgres-data:/var/lib/postgresql/data

  migration:
    build:
      context: .
      dockerfile: Dockerfile
      target: migration
      args:
        APP_VERSION: ${APP_VERSION:?APP_VERSION is required}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      NODE_ENV: production

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        APP_VERSION: ${APP_VERSION:?APP_VERSION is required}
    restart: unless-stopped
    depends_on:
      migration:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      ALLOW_LEGACY_USERNAME_LOGIN: "false"
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
      APP_VERSION: ${APP_VERSION:?APP_VERSION is required}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:?CLIENT_ORIGIN is required}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      HOST: 0.0.0.0
      INITIAL_USER_POINTS: ${INITIAL_USER_POINTS:-10000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MAX_SOCKETS_PER_USER: ${MAX_SOCKETS_PER_USER:-5}
      NODE_ENV: production
      PORT: 3000
      RUNTIME_IDLE_EVICTION_SECONDS: ${RUNTIME_IDLE_EVICTION_SECONDS:-300}
      SESSION_COOKIE_NAME: wepoker_session
      SESSION_TTL_DAYS: 14
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    init: true
    stop_grace_period: 20s

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./Caddyfile.public-test:/etc/caddy/Caddyfile:ro

volumes:
  public-test-postgres-data:
